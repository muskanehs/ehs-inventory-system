# Apache vhost — SPA + same-origin API proxy for Hostinger KVM (Ubuntu).
#
# 1. Copy to the server:
#      sudo cp docs/apache.conf /etc/apache2/sites-available/inventory.conf
# 2. Edit ServerName / DocumentRoot / paths for your domain and install dir.
# 3. Enable modules + site:
#      sudo a2enmod rewrite proxy proxy_http proxy_wstunnel headers ssl
#      sudo a2ensite inventory.conf
#      sudo apache2ctl configtest && sudo systemctl reload apache2
# 4. TLS (optional):
#      sudo certbot --apache -d yourdomain.com -d www.yourdomain.com
#
# Backend CORS_ORIGIN must match these hosts exactly (https, no trailing slash).
# Frontend: leave VITE_API_URL unset or VITE_API_URL=/api

<VirtualHost *:80>
    ServerName ehsinventory.in
    ServerAlias www.ehsinventory.in

    DocumentRoot /var/www/inventory-system/web/dist

    <Directory /var/www/inventory-system/web/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"
    # After HTTPS (certbot), prefer:
    # RequestHeader set X-Forwarded-Proto "https" env=HTTPS

    ProxyPass /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api

    ProxyPass /socket.io http://127.0.0.1:3000/socket.io
    ProxyPassReverse /socket.io http://127.0.0.1:3000/socket.io

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/socket\.io/(.*) ws://127.0.0.1:3000/socket.io/$1 [P,L]

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/inventory-error.log
    CustomLog ${APACHE_LOG_DIR}/inventory-access.log combined
</VirtualHost>
